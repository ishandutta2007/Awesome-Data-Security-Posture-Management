<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Dark Cyber Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />

    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
  </g>

  <!-- Flowing Network Graph Lines (Right Side Data Security Topology) -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <path d="M 820 100 L 960 160 L 1080 110" />
    <path d="M 960 160 L 1040 260" />
    <path d="M 820 250 L 960 160" />
  </g>

  <!-- Network Graph Data Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="820" cy="100" r="6" fill="#00f2fe" />
    <circle cx="820" cy="100" r="14" fill="none" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Node 2 (Center) -->
    <circle cx="960" cy="160" r="9" fill="#7f00ff" />
    <circle cx="960" cy="160" r="22" fill="none" stroke="#e100ff" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Node 3 -->
    <circle cx="1080" cy="110" r="6" fill="#38bdf8" />

    <!-- Node 4 -->
    <circle cx="1040" cy="260" r="7" fill="#00f2fe" />

    <!-- Node 5 -->
    <circle cx="820" cy="250" r="6" fill="#c084fc" />
  </g>

  <!-- Security Shield Vector Symbol (Right Side Accent) -->
  <g transform="translate(960, 160)" opacity="0.9">
    <!-- Outer Shield Frame -->
    <path d="M 0 -65 L 55 -38 V 22 C 0 65 -55 65 -55 22 V -38 Z" fill="url(#shield-grad)" stroke="#00f2fe" stroke-width="2.5" filter="url(#subtle-glow)" />
    <!-- Lock Core Icon -->
    <rect x="-14" y="-5" width="28" height="22" rx="4" fill="#ffffff" />
    <path d="M -8 -5 V -14 A 8 8 0 0 1 8 -14 V -5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Category Badges (Bottom Left Overlay) -->
  <g transform="translate(60, 280)">
    <!-- Pill 1: DSPM Core -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#00f2fe" text-anchor="middle">DSPM Core</text>

    <!-- Pill 2: Data Discovery -->
    <rect x="145" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#7f00ff" stroke-width="1.5" />
    <text x="220" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e100ff" text-anchor="middle">Data Discovery</text>

    <!-- Pill 3: Classification -->
    <rect x="310" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="385" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" text-anchor="middle">Classification</text>

    <!-- Pill 4: Governance -->
    <rect x="475" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="545" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#10b981" text-anchor="middle">Governance</text>
  </g>

  <!-- Main Title & Text Overlay (High Contrast Foreground) -->
  <g transform="translate(60, 105)">
    <!-- Top Category Tag -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#00f2fe" letter-spacing="2">CURATED SECURITY ECOSYSTEM</text>
    
    <!-- Main Title Line 1 -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff" filter="url(#subtle-glow)">Awesome Data Security Posture</text>
    
    <!-- Main Title Line 2 -->
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="url(#cyan-glow)">Management (DSPM)</text>
    
    <!-- Subtitle -->
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">Top SaaS Platforms &amp; Open-Source Projects for Cloud Sensitive Data Security</text>
  </g>
</svg>
